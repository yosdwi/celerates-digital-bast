<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pelaksanaan Pekerjaan</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: white;
        }
        .header {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .dev-pelaksanaan-section .table-container {
            border: 2px solid #000;
            width: 100%;
        }
        .dev-pelaksanaan-section table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        .dev-pelaksanaan-section th {
            background-color: #9BB5D6;
            color: #000;
            font-weight: bold;
            padding: 15px 10px;
            text-align: center;
            border: 1px solid #000;
        }
        .dev-pelaksanaan-section td {
            padding: 15px 10px;
            border: 1px solid #000;
            text-align: left;
        }
        td.center {
            text-align: center;
        }
        .sla-col {
            width: 20%;
        }
        .parameter-col {
            width: 50%;
        }
        .pencapaian-col {
            width: 30%;
        }
    </style>
</head>
<body>
    <!-- <div class="header">1. Pelaksanaan Pekerjaan</div> -->

    <div class="dev-pelaksanaan-section">
        <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th class="sla-col">SLA</th>
                    <th class="parameter-col">Parameter</th>
                    <th class="pencapaian-col">Pencapaian (%)</th>
                </tr>
            </thead>
            <tbody>
                {% for item in pelaksanaan_data %}
                <tr>
                    <td>{{ item.sla }}</td>
                    <td>{{ item.parameter }}</td>
                    <td class="center">{{ item.pencapaian }}%</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        </div>
    </div>
</body>
</html>
