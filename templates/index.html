<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate Report</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 400px;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: bold;
        }
        select, input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box; /* Important */
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Generate Report</h1>
        <form id="reportForm" method="POST" target="_blank">
            <div class="form-group">
                <label for="report_type">Report Type</label>
                <select id="report_type" name="report_type" required>
                    <option value="attendance" selected>PAMA Attendance</option>
                    <option value="timesheet">Timesheet</option>
                    <option value="evidence">Evidence</option>
                    <option value="tasklistiotoperation">IoT Operations Tasklist</option>
                    <option value="tasklistdeveloper">Developer Tasklist</option>
                    <option value="all">All Report (Comprehensive)</option>
                </select>
            </div>
            <div class="form-group" id="evidence_type_group" style="display: none;">
                <label for="evidence_type">Evidence Type</label>
                <select id="evidence_type" name="type">
                    <option value="iotoperations">IoT Operations</option>
                    <option value="developer">Developer</option>
                </select>
            </div>
            <div class="form-group" id="iot_page_group" style="display: none;">
                <label for="iot_page">IoT Operations Page</label>
                <select id="iot_page" name="page">
                    <option value="problem">Problem Analysis</option>
                    <option value="aktivitas">Activities Detail</option>
                    <option value="respon">Response Time</option>
                </select>
            </div>
            <div class="form-group" id="dev_page_group" style="display: none;">
                <label for="dev_page">Developer Page</label>
                <select id="dev_page" name="page">
                    <option value="pelaksanaan">Pelaksanaan Pekerjaan</option>
                    <option value="kualitas">Kualitas Kode</option>
                    <option value="rilis">Waktu Rilis</option>
                    <option value="support">Dukungan Support</option>
                </select>
            </div>
            <div class="form-group" id="all_type_group" style="display: none;">
                <label for="all_type">Report Type</label>
                <select id="all_type" name="type">
                    <option value="iotoperation">IoT Operations</option>
                    <option value="developer">Developer</option>
                </select>
            </div>
            <div class="form-group">
                <label for="year">Year</label>
                <select id="year" name="year" required>
                    <!-- Options will be populated by JavaScript -->
                </select>
            </div>
            <div class="form-group">
                <label for="month">Month</label>
                <select id="month" name="month" required>
                    <!-- Options will be populated by JavaScript -->
                </select>
            </div>
            <button type="submit">Generate Report</button>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const yearSelect = document.getElementById('year');
            const monthSelect = document.getElementById('month');
            const reportTypeSelect = document.getElementById('report_type');
            const reportForm = document.getElementById('reportForm');

            const currentYear = new Date().getFullYear();
            const currentMonth = new Date().getMonth() + 1;

            // Populate years
            for (let i = currentYear; i >= currentYear - 5; i--) {
                const option = document.createElement('option');
                option.value = i;
                option.textContent = i;
                yearSelect.appendChild(option);
            }

            // Populate months
            const months = [
                { value: 1, name: 'January' }, { value: 2, name: 'February' },
                { value: 3, name: 'March' }, { value: 4, name: 'April' },
                { value: 5, name: 'May' }, { value: 6, name: 'June' },
                { value: 7, name: 'July' }, { value: 8, name: 'August' },
                { value: 9, name: 'September' }, { value: 10, name: 'October' },
                { value: 11, name: 'November' }, { value: 12, name: 'December' }
            ];

            months.forEach(month => {
                const option = document.createElement('option');
                option.value = month.value;
                option.textContent = month.name;
                monthSelect.appendChild(option);
            });
            
            // Set defaults
            yearSelect.value = currentYear;
            monthSelect.value = currentMonth;

            const evidenceTypeGroup = document.getElementById('evidence_type_group');
            const iotPageGroup = document.getElementById('iot_page_group');
            const devPageGroup = document.getElementById('dev_page_group');
            const allTypeGroup = document.getElementById('all_type_group');

            // Update form action and visibility based on selection
            function updateFormAction() {
                const reportType = reportTypeSelect.value;
                if (reportType === 'attendance') {
                    reportForm.action = '/report/pama/attendance';
                    evidenceTypeGroup.style.display = 'none';
                    iotPageGroup.style.display = 'none';
                    devPageGroup.style.display = 'none';
                    allTypeGroup.style.display = 'none';
                    yearSelect.parentElement.style.display = 'block';
                } else if (reportType === 'timesheet') {
                    reportForm.action = '/report/timesheet';
                    evidenceTypeGroup.style.display = 'none';
                    iotPageGroup.style.display = 'none';
                    devPageGroup.style.display = 'none';
                    allTypeGroup.style.display = 'none';
                    yearSelect.parentElement.style.display = 'block';
                } else if (reportType === 'evidence') {
                    reportForm.action = '/report/evidence';
                    evidenceTypeGroup.style.display = 'block';
                    iotPageGroup.style.display = 'none';
                    devPageGroup.style.display = 'none';
                    allTypeGroup.style.display = 'none';
                    yearSelect.parentElement.style.display = 'none';
                } else if (reportType === 'tasklistiotoperation') {
                    reportForm.action = '/report/tasklistiotoperation';
                    evidenceTypeGroup.style.display = 'none';
                    iotPageGroup.style.display = 'block';
                    devPageGroup.style.display = 'none';
                    allTypeGroup.style.display = 'none';
                    yearSelect.parentElement.style.display = 'none';
                } else if (reportType === 'tasklistdeveloper') {
                    reportForm.action = '/report/tasklistdeveloper';
                    evidenceTypeGroup.style.display = 'none';
                    iotPageGroup.style.display = 'none';
                    devPageGroup.style.display = 'block';
                    allTypeGroup.style.display = 'none';
                    yearSelect.parentElement.style.display = 'none';
                } else if (reportType === 'all') {
                    reportForm.action = '/report/all';
                    evidenceTypeGroup.style.display = 'none';
                    iotPageGroup.style.display = 'none';
                    devPageGroup.style.display = 'none';
                    allTypeGroup.style.display = 'block';
                    yearSelect.parentElement.style.display = 'none';
                }
            }

            reportTypeSelect.addEventListener('change', updateFormAction);
            
            // Initial call
            updateFormAction();
        });
    </script>
</body>
</html>
