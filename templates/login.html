<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Digital BAST</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/admin/static/css/admin_style.css">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-wrapper">
            <div class="login-header">
                <div class="logo-container">
                    <img src="/admin/static/img/logo_celerates.jpg" alt="Celerates" class="logo">
                </div>
                <h1>Digital BAST</h1>
                <p class="text-muted">Administrative Portal</p>
            </div>

            <div class="login-form-container">
                {% if error %}
                <div class="alert alert-danger" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error }}
                </div>
                {% endif %}

                <form id="loginForm" action="/admin/auth/login" method="POST" class="login-form">
                    <div class="form-floating mb-3">
                        <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
                        <label for="email">
                            <i class="bi bi-envelope me-2"></i>Email Address
                        </label>
                    </div>

                    <div class="form-floating mb-4">
                        <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
                        <label for="password">
                            <i class="bi bi-lock me-2"></i>Password
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100 login-btn" id="loginBtn">
                        <span class="btn-content">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                        </span>
                        <span class="btn-loading d-none">
                            <span class="spinner-border spinner-border-sm me-2" role="status"></span>
                            Signing in...
                        </span>
                    </button>
                </form>
            </div>

            <div class="login-footer">
                <small class="text-muted">
                    <i class="bi bi-shield-lock me-1"></i>
                    Secure access for authorized personnel only
                </small>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            const btn = document.getElementById('loginBtn');
            const btnContent = btn.querySelector('.btn-content');
            const btnLoading = btn.querySelector('.btn-loading');

            btn.disabled = true;
            btnContent.classList.add('d-none');
            btnLoading.classList.remove('d-none');
        });

        // Auto-focus email field
        document.getElementById('email').focus();

        // Handle enter key in form
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('loginForm').submit();
            }
        });
    </script>
</body>
</html>
