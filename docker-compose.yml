  scheduler:
    image: mcuadros/ofelia:latest
    container_name: digital-bast-scheduler
    depends_on:
      - app
    command: daemon --docker
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      # PostgreSQL Backup Job - Production at 22:00 (10 PM)
      ofelia.job-run.postgres_backup.schedule: "0 22 * * *"
      ofelia.job-run.postgres_backup.command: "sh /home/debian/script/postgresql/postgres_backup.sh"

